datasets:
  tcga_thca:
    priority:
      - local TCGA pancancer expression and phenotype
      - UCSC Xena TCGA-THCA processed files
      - GDC/manual download
    required:
      - RNA-seq gene expression matrix
      - phenotype or clinical table
    optional:
      - mutation MAF or mutation-group table
      - CNV/GISTIC
      - methylation
      - pathology metadata
  spatial_thyroid:
    priority:
      - local processed GSE250521 Visium h5ad files
      - local raw GSE250521 10x Visium files
      - GEO download/manual download
    expected_samples:
      normal: [N-1, N-2, N-3, N-4]
      ptc: [PTC-1, PTC-2, PTC-3, PTC-4]
      locally_advanced_ptc: [LPTC-1, LPTC-2, LPTC-3, LPTC-4]
      atc: [ATC-1, ATC-2, ATC-3, ATC-4]
  scrna_reference:
    priority:
      - local GSE193581 h5ad with author cell types
      - local GSE250521 scRNA mtx files
      - manual download
  depmap_prism:
    priority:
      - local DepMap/PRISM-derived tables
      - local DepMap expression CSV
      - manual download current DepMap release
