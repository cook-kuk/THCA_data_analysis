thyroid_differentiation_rai_readiness:
  short_name: rai_differentiation
  core: [SLC5A5, TG, TPO, TSHR, PAX8, NKX2-1, FOXE1, DIO1, DIO2, DUOX1, DUOX2, SLC26A4]
  interpretation: High = differentiated / potentially RAI-readable or RAI-restorable context. Low = dedifferentiated / RAI-refractory-like context.
mapk_dedifferentiation_stress:
  short_name: mapk
  core: [DUSP4, DUSP5, DUSP6, ETV4, ETV5, SPRY2, SPRY4, FOS, JUN, MYC]
  interpretation: High = MAPK/ERK signaling proxy, potentially BRAF/RAS pathway activation. Caveat = not a substitute for phospho-ERK or mutation status.
hla_class_i_apm:
  short_name: hla_i_apm
  core: [HLA-A, HLA-B, HLA-C, B2M, TAP1, TAP2, TAPBP, PSMB8, PSMB9, PSMB10, ERAP1, ERAP2, NLRC5]
  interpretation: High = immune-visible / antigen-presentation competent. Low = possible immune-invisible tumor state.
hla_class_ii_apc_niche:
  short_name: hla_ii_apc
  core: [HLA-DRA, HLA-DRB1, HLA-DRB3, HLA-DRB4, HLA-DRB5, HLA-DPA1, HLA-DPB1, HLA-DQA1, HLA-DQB1, CD74, CIITA]
  interpretation: High = APC-rich or inflammatory HLA-II niche. Need deconvolution to distinguish tumor HLA-II vs immune APC.
t_cell_cytotoxicity:
  short_name: cytotoxic_t
  core: [CD3D, CD3E, CD8A, CD8B, GZMB, GZMA, PRF1, NKG7, GNLY, IFNG]
  interpretation: High = T-cell/cytotoxic infiltration or proximity.
ifn_immune_activation:
  short_name: ifn_activation
  core: [IFNG, CXCL9, CXCL10, CXCL11, STAT1, IRF1, GBP1, IDO1]
  interpretation: High = IFN-responsive inflamed state.
checkpoint_exhaustion_suppression:
  short_name: checkpoint_suppression
  core: [PDCD1, CD274, CTLA4, LAG3, HAVCR2, TIGIT, IDO1, TOX, FOXP3, IL10]
  interpretation: High = immune activation plus suppression/exhaustion context.
myeloid_tam:
  short_name: myeloid_tam
  core: [CD68, CD163, MRC1, CSF1R, CCL2, CCR2, SPP1, LST1, AIF1, LILRB1, LILRB2, FCGR3A]
  interpretation: High = macrophage/myeloid-rich niche; may indicate immunosuppressive microenvironment.
caf_ecm_tgfb_barrier:
  short_name: caf_ecm_tgfb
  core: [ACTA2, COL1A1, COL1A2, COL3A1, COL5A1, FAP, PDGFRB, CXCL12, TGFB1, TGFBR1, TGFBR2, SERPINE1, POSTN, FN1]
  interpretation: High = stromal/CAF barrier, possible CD8 exclusion and drug-delivery barrier.
vascular_permeability_delivery_proxy:
  short_name: vascular_delivery_proxy
  core: [PECAM1, VWF, KDR, FLT1, ENG, ANGPT2, VEGFA, ESAM, EMCN]
  barrier_negative: [COL1A1, ACTA2, FAP, CXCL12, POSTN]
  interpretation: Exploratory proxy only. High endothelial plus low barrier may indicate delivery-permissive zone; high ECM/CAF may indicate delivery-failure zone.
hypoxia_metabolism:
  short_name: hypoxia
  core: [CA9, VEGFA, SLC2A1, LDHA, HK2, PDK1, HIF1A, BNIP3]
  interpretation: Hypoxic/metabolic niche, may affect drug delivery, immune exclusion, and aggressiveness.
proliferation:
  short_name: proliferation
  core: [MKI67, TOP2A, PCNA, MCM2, MCM5, CCNB1, CDK1]
  interpretation: Growth/aggression proxy.
tumor_epithelial_thyroid_lineage:
  short_name: tumor_epithelial
  core: [EPCAM, KRT8, KRT18, KRT19, PAX8, TG, TPO]
  interpretation: Helps identify tumor/epithelial territories in spatial data.
dm1_dark_lineage:
  short_name: dm1_dark_lineage
  core: []
  interpretation: Search local previous files for DM1/dark-lineage gene lists. If found, populate automatically. If not found, skip with a warning rather than hallucinating.
