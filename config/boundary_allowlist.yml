# Boundary allowlist — read by scripts/boundary_audit/*.py
#
# Purpose: declare narrow contexts in which otherwise-forbidden terms may
# appear without tripping the audit. Anything not allowlisted here causes
# the corresponding audit script to exit non-zero.
#
# allowed_files glob patterns are matched against the file basename AND the
# repo-relative path tail. Use plain filenames for exact matches and shell
# globs (e.g. "PAPER2_*.md") for families.
#
# IMPORTANT — every entry has a reason. Do not extend allowlists silently.

paper1_allowed_terms:
  - term: "HLA-I"
    allowed_files: &paper1_allow_files
      - "HLA_CANCER_SEPARATION_RULES.md"
      - "boundary_audit_*.md"
      - "paper1_hla_contamination_audit.md"
      - "paper2_cancer_claim_contamination_audit.md"
      - "bridge_quarantine_audit.md"
      - "cross_contamination_check_paper1.md"
      - "p1_cross_contamination_audit.html"
      - "p1_onepage_audit.html"
      - "p1_status_report.html"
      - "p1_comprehensive_report.html"
      - "dashboard.html"
      - "06_discussion.md"
      - "05_figure_captions.md"
      - "05_supp_figure_captions_v17_dm.md"
      - "10_full_manuscript_compiled.md"
      - "14_self_verification_report.md"
      - "_terminology_scan_hits.tsv"
      - "_terminology_scanner.py"
      - "build_extra_figs.py"
      - "02_outline.md"
      - "03_intro_references.bib"
      - "README.md"
      - "PAPER2_*.md"
      - "_PAPER2_*.md"
      - "_paper2_*.md"
      - "_session_origin_paper2_*.md"
      - "_audit_HT_vs_GD_*.md"
      - "_archive_*_sprint_draft.md"
      - "_LEE_2014_FILL_DECISION_LOCK_*.md"
      - "_for_web_claude_*.md"
      - "_prep_*.md"
      - "*manifest.csv"
      - "*master_dataset_catalog.csv"
      - "claim_matrix.csv"
      - "DATA_EXPANSION_AND_BOUNDARY_REPORT_*.md"
      - "download_plan.md"
    reason: "HLA-I as transcriptomic module / residualization control; explicit Paper 2 deferral; or audit/Paper-2-staging/manifest file"

  - term: "HLA-II"
    allowed_files: *paper1_allow_files
    reason: "HLA-II module for residualization or transcriptomic immune context; explicit Paper 2 deferral; or audit/Paper-2-staging/manifest file"

  - term: "HLA"
    allowed_files: *paper1_allow_files
    reason: "Boundary, audit, manifest, Paper-2-staging, or outline file may reference HLA by design"

  - term: "MHC"
    allowed_files: *paper1_allow_files
    reason: "Same allowlist as HLA — boundary/audit/manifest/Paper-2-staging context"

  - term: "DPB1"
    allowed_files: *paper1_allow_files
    reason: "Allele names appear inside HLA-II module gene-list captions and Paper 2 staging files"

  - term: "DQB1"
    allowed_files: *paper1_allow_files
    reason: "Allele names appear inside HLA-II module gene-list captions and Paper 2 staging files"

  - term: "DRB1"
    allowed_files: *paper1_allow_files
    reason: "Allele names appear inside HLA-II module gene-list captions and Paper 2 staging files"

  - term: "DQA1"
    allowed_files: *paper1_allow_files
    reason: "Same — HLA-II module / Paper 2 staging"

  - term: "DPA1"
    allowed_files: *paper1_allow_files
    reason: "Same — HLA-II module / Paper 2 staging"

  - term: "AFND"
    allowed_files: *paper1_allow_files
    reason: "AFND referenced in boundary docs / Paper 2 staging"

  - term: "carrier frequency"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs and Paper 2 staging only"

  - term: "allele frequency"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs and Paper 2 staging only"

  - term: "Hashimoto"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs, Paper 2 staging, HT-overlap audit / cross-contamination check"

  - term: "Graves"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs, Paper 2 staging, GD audit / cross-contamination check"

  - term: "HT overlap"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs only"

  - term: "GD"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs and Paper 2 staging only"

  - term: "autoimmune susceptibility"
    allowed_files: *paper1_allow_files
    reason: "Boundary warning only"

  - term: "AITD"
    allowed_files: *paper1_allow_files
    reason: "Boundary docs and Paper 2 staging only"

  - term: "autoimmune"
    allowed_files: *paper1_allow_files
