bridge_allowed_terms:
  - term: "HLA gene expression"
    allowed_context: "transcriptomic immune context only, not allele genotype"
    reason: "HLA-I/HLA-II gene-level expression is a permitted bridge analysis when explicitly labeled as transcriptomic, not as allele typing"

  - term: "HLA-I module"
    allowed_context: "transcriptomic immune context only, not allele genotype"
    reason: "Module score from a curated HLA-I gene set is allowed as bridge immune context"

  - term: "HLA-II module"
    allowed_context: "transcriptomic immune context only, not allele genotype"
    reason: "Module score from a curated HLA-II gene set is allowed as bridge immune context"

  # Manifest CSVs are derived catalog metadata, not bridge analysis outputs. They
  # contain bridge-forbidden terms by design (in `forbidden_use` columns and
  # in [VERIFIED-WRONG:'...title...'] annotations). Allow these manifest files
  # for the bridge-forbidden term list. Actual bridge outputs land under
  # `data_registry/bridge_quarantine_ht_ptc/` and continue to be scanned strictly.
  - term: "survival"
    allowed_files: &bridge_manifest_files
      - "*manifest.csv"
      - "*master_dataset_catalog.csv"
      - "claim_matrix.csv"
      - "HLA_CANCER_SEPARATION_RULES.md"
    reason: "Manifest catalog descriptors and verified-wrong annotations may contain the word"
  - term: "OS"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "DSS"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "PFI"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "recurrence"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "patient selection"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "clinical risk prediction"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "carrier frequency"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"
  - term: "allele association"
    allowed_files: *bridge_manifest_files
    reason: "Manifest catalog descriptors only"

