[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research"
version = "0.1.0"
description = "Reusable patterns for multi-phase research orchestration, distilled from a 6-month thyroid-cancer transcriptomic project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seungho Cook", email = "kukshomr@gmail.com" }]
keywords = ["agent", "agentic", "research", "orchestration", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]
demo = ["pandas>=2"]

[project.urls]
Homepage = "https://github.com/your-handle/agentic-research"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_research*"]
