/* --------------------------- CHATBOT DEMO --------------------------- */

function ChatbotDemo() {
  const [step, setStep] = useState(0);
  const [running, setRunning] = useState(false);
  const timerRef = useRef(null);
  const scrollRef = useRef(null);

  useEffect(() => () => clearTimeout(timerRef.current), []);

  function run() {
    if (running) return;
    setStep(0); setRunning(true);
    const tick = (i) => {
      if (i >= CHAT_SCRIPT.length) { setRunning(false); return; }
      setStep(i + 1);
      timerRef.current = setTimeout(()=> tick(i+1), 750);
    };
    tick(0);
  }
  function reset() { clearTimeout(timerRef.current); setStep(0); setRunning(false); }

  useEffect(()=>{
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [step]);

  const visible = CHAT_SCRIPT.slice(0, step);
  const currentStage = useMemo(()=>{
    const last = [...visible].reverse().find(m => typeof m.stage === 'number');
    return last ? last.stage : -1;
  }, [step]);
  const candidatesShown = step >= 7;
  const checklistShown = step >= 9;

  return (
