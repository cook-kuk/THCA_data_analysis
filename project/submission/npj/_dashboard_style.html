<style>
  body { font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         max-width: 1100px; margin: 30px auto; padding: 0 24px; color: #1f2937; line-height: 1.7; }
  h1 { font-size: 28px; margin-bottom: 4px; border-bottom: 3px solid #1d4ed8; padding-bottom: 8px; }
  h2 { font-size: 22px; border-bottom: 1px solid #d1d5db; padding-bottom: 6px; margin-top: 38px; color: #1d4ed8; }
  h3 { font-size: 18px; color: #1f2937; margin-top: 28px; }
  h4 { font-size: 15px; color: #374151; margin-top: 18px; margin-bottom: 6px; }
  .badge { display:inline-block; background:#dc2626; color:white; padding:3px 9px; border-radius:5px;
           font-size:11px; font-weight:bold; vertical-align: middle; margin-left: 10px; }
  .badge.ok { background:#10b981; }
  .badge.warn { background:#f59e0b; }
  .badge.kr { background:#7c3aed; }
  details { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 14px;
            margin: 10px 0; cursor: pointer; }
  details > summary { font-weight: 600; color: #1d4ed8; cursor: pointer; padding: 4px 0; outline: none; }
  details > summary::after { content: " ▶ 자세히 보기"; font-size: 12px; color: #6b7280; font-weight: normal; }
  details[open] > summary::after { content: " ▼ 접기"; }
  details[open] { background: #f5f3ff; border-color: #c4b5fd; }
  details > .body { padding-top: 12px; padding-left: 6px; cursor: text; line-height: 1.7; color: #1f2937; }
  details > .body p { margin: 8px 0; }
  details > .body ul, details > .body ol { margin: 8px 0; padding-left: 24px; }
  details > .body code { background: #fff; padding: 1px 6px; border-radius: 3px; font-size: 13px; border: 1px solid #ddd; }
  details > .body pre { background: #1f2937; color: #f3f4f6; padding: 10px; border-radius: 5px; font-size: 12px; overflow-x: auto; }
  details > .body table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  details > .body th, details > .body td { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; font-size: 13px; }
  details > .body th { background: #e0e7ff; }
  table.metric { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  table.metric th, table.metric td { border: 1px solid #d1d5db; padding: 8px 12px; }
  table.metric th { background: #1e40af; color: white; }
  table.metric tr:nth-child(even) { background: #f9fafb; }
  .alert { background: #fef2f2; border-left: 4px solid #dc2626; padding: 12px 16px; border-radius: 4px; margin: 14px 0; }
  .ok { background: #ecfdf5; border-left: 4px solid #10b981; padding: 12px 16px; border-radius: 4px; margin: 14px 0; }
  .info { background: #eff6ff; border-left: 4px solid #1d4ed8; padding: 12px 16px; border-radius: 4px; margin: 14px 0; }
  .warn { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 12px 16px; border-radius: 4px; margin: 14px 0; }
  .nav { background: #f3f4f6; padding: 12px 16px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
  .nav a { display: inline-block; margin: 4px 8px; color: #1d4ed8; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .topnav { background: #1e40af; color: white; padding: 10px 16px; border-radius: 6px; margin: 12px 0; font-size: 13px; }
  .topnav a { color: #dbeafe; margin-right: 12px; text-decoration: none; }
  .topnav a:hover { text-decoration: underline; color: white; }
  hr.sep { border: none; border-top: 2px dashed #d1d5db; margin: 30px 0; }
  .qbox { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; padding: 10px 14px; margin: 10px 0; }
  .qbox > summary { color: #92400e; }
</style>
